<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ 致我最爱的人</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas#bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

  /* ── 主内容区 ── */
  .container {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10; pointer-events: none;
  }

  .container > * { pointer-events: auto; }

  /* ── 纪念日倒计时 ── */
  .countdown {
    position: fixed; top: 30px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex; gap: 20px;
  }
  .countdown .unit {
    text-align: center;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 14px 20px;
    min-width: 80px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .countdown .num {
    font-size: 36px; font-weight: 700;
    background: linear-gradient(135deg, #ff6b9d, #c44dff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
  }
  .countdown .label {
    font-size: 12px; color: rgba(255,255,255,0.65);
    margin-top: 6px; letter-spacing: 2px;
  }

  /* ── 主标题 ── */
  .main-title {
    font-size: clamp(32px, 6vw, 60px);
    font-weight: 700;
    background: linear-gradient(135deg, #ff6b9d 0%, #c44dff 40%, #6bc5ff 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 30px rgba(196, 77, 255, 0.4));
    animation: titleGlow 3s ease-in-out infinite;
    margin-bottom: 8px;
    text-align: center;
    letter-spacing: 4px;
  }
  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(196,77,255,0.4)); }
    50% { filter: drop-shadow(0 0 40px rgba(255,107,157,0.6)); }
  }

  /* ── 情话展示区 ── */
  .message-box {
    position: relative;
    max-width: 620px; width: 85vw;
    text-align: center;
    padding: 40px 36px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    margin: 16px 0;
  }
  .message-box .quotes {
    font-size: 20px; color: #fff;
    line-height: 1.8; letter-spacing: 1px;
    min-height: 60px;
    transition: opacity 0.5s, transform 0.5s;
  }
  .message-box .quotes.fade {
    opacity: 0; transform: translateY(10px);
  }

  /* ── 打字光标 ── */
  .cursor::after {
    content: '|';
    animation: blink 1s step-end infinite;
    color: #ff6b9d;
    font-weight: 300;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── 按钮 ── */
  .btn-row {
    display: flex; gap: 16px; margin-top: 10px;
    flex-wrap: wrap; justify-content: center;
  }
  .btn {
    padding: 10px 28px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
    font-family: inherit;
  }
  .btn:hover {
    background: rgba(255,107,157,0.2);
    border-color: #ff6b9d;
    box-shadow: 0 0 24px rgba(255,107,157,0.3);
    transform: translateY(-2px);
  }
  .btn.music-btn {
    position: fixed; top: 30px; right: 30px;
    padding: 8px 16px; z-index: 30;
  }

  /* ── 响应式 ── */
  @media (max-width: 480px) {
    .countdown { gap: 10px; top: 16px; }
    .countdown .unit { padding: 10px 14px; min-width: 60px; }
    .countdown .num { font-size: 24px; }
    .message-box { padding: 28px 24px; }
    .message-box .quotes { font-size: 16px; }
    .btn { padding: 8px 20px; font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<button class="btn music-btn" id="musicBtn" onclick="toggleMusic()">🎵 音乐</button>

<div class="container">
  <div class="countdown" id="countdown">
    <div class="unit"><div class="num" id="days">0</div><div class="label">天</div></div>
    <div class="unit"><div class="num" id="hours">0</div><div class="label">时</div></div>
    <div class="unit"><div class="num" id="mins">0</div><div class="label">分</div></div>
    <div class="unit"><div class="num" id="secs">0</div><div class="label">秒</div></div>
  </div>

  <h1 class="main-title" id="mainTitle">吴老师，做我老婆之后再改称呼哈。</h1>

  <div class="message-box">
    <div class="quotes cursor" id="quoteText"></div>
  </div>

  <div class="btn-row">
    <button class="btn" onclick="nextQuote()">✨ 换一句</button>
    <button class="btn" onclick="burstHearts()">💕 点我</button>
  </div>
</div>

<script>
// ==================== 数据配置 ====================
const LOVE_QUOTES = [
  "想与你长久，不是贪心，是我此生唯一的心愿。",
  "莫要怀疑，也莫要纠结，我的心意，早已向你倾斜。",
  "对你，我从来认真，认真到连自己都觉得意外。",
  "你的性情，是我最难以抗拒的温柔。",
  "你这一方天地，我只想独占。",
  "待尘埃落定你自会知晓，我挂念的从不是事，而是你的心。",
  "你满心都是健身，可曾想过，也分我一点时光？",
  "与其理会旁人的闲事，不如，多看我一眼。",
  "为你花的心思，我从来甘之如饴。",
  "我的心事，你当真一点都察觉不到吗？",
  "从前你总装作看不见我的情绪，往后，我不许你再躲。",
  "纵使你气鼓鼓的模样，在我眼里，也格外可爱。",
  "你说我性子不坏，那我便努力，不负你的期待。",
  "别再回避了，我会一直在这里，等你慢慢靠近。",
  "来日方长，有你的未来，才值得期待。",
];

// 设置你们在一起的日期 (修改这里!)
const TOGETHER_DATE = new Date('2026-08-08'); // <-- 改成你们的纪念日

// ==================== Canvas 星空背景 ====================
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H;

let stars = [];
let hearts = [];
let shootingStars = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initStars();
  initShootingStars();
}
window.addEventListener('resize', resize);

// 星星
function initStars() {
  stars = [];
  const count = Math.floor(W * H / 1200);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.8 + 0.3,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005,
      opacity: Math.random(),
    });
  }
}

// 爱心粒子
function Heart(x, y) {
  this.x = x; this.y = y;
  this.vx = (Math.random() - 0.5) * 1.5;
  this.vy = -(Math.random() * 2 + 2);
  this.size = Math.random() * 10 + 6;
  this.opacity = 1;
  this.fade = Math.random() * 0.015 + 0.008;
  this.angle = Math.random() * Math.PI * 2;
  this.spin = (Math.random() - 0.5) * 0.05;
  this.color = ['#ff6b9d','#c44dff','#ff9a9e','#6bc5ff','#ff6b6b'][Math.floor(Math.random()*5)];
}
Heart.prototype.update = function() {
  this.x += this.vx; this.y += this.vy;
  this.vy -= 0.02; // float up
  this.opacity -= this.fade;
  this.angle += this.spin;
};
Heart.prototype.draw = function(ctx) {
  ctx.save();
  ctx.globalAlpha = this.opacity;
  ctx.translate(this.x, this.y);
  ctx.rotate(this.angle);
  ctx.fillStyle = this.color;
  ctx.shadowBlur = 10;
  ctx.shadowColor = this.color;
  const s = this.size;
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.4);
  ctx.bezierCurveTo(-s*0.5, -s*0.9, -s, -s*0.2, 0, s*0.35);
  ctx.bezierCurveTo(s, -s*0.2, s*0.5, -s*0.9, 0, -s*0.4);
  ctx.fill();
  ctx.restore();
};

// 流星
function ShootingStar() {
  this.reset();
}
ShootingStar.prototype.reset = function() {
  this.x = Math.random() * W * 0.6;
  this.y = Math.random() * H * 0.3;
  this.len = Math.random() * 100 + 60;
  this.speed = Math.random() * 8 + 6;
  this.opacity = 1;
  this.fade = Math.random() * 0.015 + 0.01;
};
ShootingStar.prototype.update = function() {
  this.x += this.speed;
  this.y += this.speed * 0.5;
  this.opacity -= this.fade;
  if (this.opacity <= 0) this.reset();
};
ShootingStar.prototype.draw = function(ctx) {
  ctx.save();
  const grad = ctx.createLinearGradient(this.x, this.y, this.x - this.len, this.y - this.len * 0.5);
  grad.addColorStop(0, `rgba(255,255,255,${this.opacity})`);
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(this.x, this.y);
  ctx.lineTo(this.x - this.len, this.y - this.len * 0.5);
  ctx.stroke();
  ctx.restore();
};

function initShootingStars() {
  shootingStars = [];
  for (let i = 0; i < 3; i++) {
    const ss = new ShootingStar();
    ss.x = Math.random() * W;
    ss.y = Math.random() * H * 0.4;
    ss.opacity = Math.random() * 0.5;
    shootingStars.push(ss);
  }
}

// ==================== 绘制循环 ====================
function drawBg(t) {
  const c1 = [10 + Math.sin(t*0.3)*3, 6 + Math.sin(t*0.5)*2, 30 + Math.sin(t*0.4)*5];
  const c2 = [5 + Math.cos(t*0.4)*3, 3 + Math.cos(t*0.6)*2, 20 + Math.cos(t*0.5)*5];
  const grad = ctx.createRadialGradient(W*0.3, H*0.3, 0, W*0.5, H*0.5, Math.max(W,H)*0.7);
  grad.addColorStop(0, `rgb(${c1[0]|0},${c1[1]|0},${c1[2]|0})`);
  grad.addColorStop(0.5, `rgb(${c2[0]|0},${c2[1]|0},${c2[2]|0})`);
  grad.addColorStop(1, '#020010');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function render(timestamp) {
  ctx.clearRect(0, 0, W, H);
  drawBg(timestamp / 1000);

  // 星星
  for (const s of stars) {
    s.twinkle += s.speed;
    s.opacity += (Math.sin(s.twinkle) * 0.01);
    s.opacity = Math.max(0.2, Math.min(1, s.opacity));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
    ctx.fill();
    // 亮星加光晕
    if (s.r > 1.3 && s.opacity > 0.7) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,180,255,${s.opacity * 0.15})`;
      ctx.fill();
    }
  }

  // 流星
  for (const ss of shootingStars) {
    ss.update(); ss.draw(ctx);
  }

  // 爱心粒子
  hearts = hearts.filter(h => h.opacity > 0);
  for (const h of hearts) {
    h.update(); h.draw(ctx);
  }

  requestAnimationFrame(render);
}

// ==================== 爱心爆炸 ====================
function burstHearts(e) {
  let cx = W / 2, cy = H / 2;
  if (e && e.clientX) { cx = e.clientX; cy = e.clientY; }
  for (let i = 0; i < 40; i++) {
    const h = new Heart(cx, cy);
    h.vx = (Math.random() - 0.5) * 10;
    h.vy = -(Math.random() * 8 + 4);
    h.size = Math.random() * 20 + 10;
    h.fade = Math.random() * 0.008 + 0.004;
    hearts.push(h);
  }
}

// 单击空白处也爆爱心
document.addEventListener('click', function(e) {
  if (e.target.tagName === 'BUTTON') return;
  burstHearts(e);
});

// ==================== 情话打字机 ====================
let quoteIdx = 0;
let typeTimer = null;
const quoteEl = document.getElementById('quoteText');

function typeQuote(text) {
  quoteEl.classList.remove('cursor');
  quoteEl.classList.add('fade');
  clearTimeout(typeTimer);

  setTimeout(() => {
    quoteEl.textContent = '';
    quoteEl.classList.remove('fade');
    quoteEl.classList.add('cursor');

    let i = 0;
    function typeChar() {
      if (i < text.length) {
        quoteEl.textContent += text[i];
        i++;
        typeTimer = setTimeout(typeChar, 80 + Math.random() * 60);
      } else {
        quoteEl.classList.remove('cursor');
      }
    }
    typeChar();
  }, 400);
}

function nextQuote() {
  quoteIdx = (quoteIdx + 1) % LOVE_QUOTES.length;
  typeQuote(LOVE_QUOTES[quoteIdx]);
}

// 随机起始
function initQuote() {
  quoteIdx = Math.floor(Math.random() * LOVE_QUOTES.length);
  typeQuote(LOVE_QUOTES[quoteIdx]);
}

// ==================== 倒计时 ====================
function updateCountdown() {
  const now = new Date();
  const diff = now - TOGETHER_DATE;
  const totalSeconds = Math.max(0, Math.floor(diff / 1000));

  const d = Math.floor(totalSeconds / 86400);
  const h = Math.floor((totalSeconds % 86400) / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;

  document.getElementById('days').textContent = d;
  document.getElementById('hours').textContent = String(h).padStart(2, '0');
  document.getElementById('mins').textContent = String(m).padStart(2, '0');
  document.getElementById('secs').textContent = String(s).padStart(2, '0');
}

// ==================== 背景音乐 ====================
let musicOn = false;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function createMusic() {
  // 简单的音乐和声生成
  const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25]; // C major
  const chords = [
    [261.63, 329.63, 392.00], // C
    [293.66, 349.23, 440.00], // Dm
    [329.63, 392.00, 493.88], // Em
    [349.23, 440.00, 523.25], // F
    [392.00, 493.88, 587.33], // G
    [440.00, 523.25, 659.25], // Am
  ];

  const gainNode = audioCtx.createGain();
  gainNode.gain.value = 0.06;
  gainNode.connect(audioCtx.destination);

  let chordIdx = 0;
  let noteIdx = 0;

  const melody = [0, 2, 4, 2, 0, 1, 3, 5, 4, 2, 0, 1, 3, 4, 5, 7, 5, 4, 2, 0];

  // 和弦铺底
  function playChord() {
    const chord = chords[chordIdx % chords.length];
    chord.forEach(freq => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      g.gain.value = 0.025;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
      osc.connect(g);
      g.connect(gainNode);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 2.5);
    });
    chordIdx++;
  }

  // 旋律
  function playMelody() {
    if (!musicOn) return;
    const freq = notes[melody[noteIdx % melody.length]];
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    g.gain.value = 0.04;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(g);
    g.connect(gainNode);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.5);
    noteIdx++;
    if (noteIdx % melody.length === 0) playChord();
  }

  setInterval(() => { if (musicOn) playMelody(); }, 600);
  setInterval(() => { if (musicOn) playChord(); }, 2500);
}

function toggleMusic() {
  if (!musicOn) {
    musicOn = true;
    document.getElementById('musicBtn').textContent = '🔇 静音';
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } else {
    musicOn = false;
    document.getElementById('musicBtn').textContent = '🎵 音乐';
  }
}

// ==================== 启动 ====================
window.addEventListener('load', () => {
  resize();
  initQuote();
  updateCountdown();
  setInterval(updateCountdown, 1000);
  createMusic();
  requestAnimationFrame(render);

  // 自动播放音乐 (需要一次用户交互后)
  document.addEventListener('click', function resumeAudio() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: false });
});

// 窗口大小变化时保持实时渲染
window.addEventListener('resize', resize);
</script>
</body>
</html>
