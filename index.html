<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鉂わ笍 鑷存垜鏈€鐖辩殑浜?/title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas#bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

  /* 鈹€鈹€ 涓诲唴瀹瑰尯 鈹€鈹€ */
  .container {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10; pointer-events: none;
  }

  .container > * { pointer-events: auto; }

  /* 鈹€鈹€ 绾康鏃ュ€掕鏃?鈹€鈹€ */
  .countdown {
    position: fixed; top: 30px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex; gap: 20px;
  }
  .countdown .unit {
    text-align: center;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 14px 20px;
    min-width: 80px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .countdown .num {
    font-size: 36px; font-weight: 700;
    background: linear-gradient(135deg, #ff6b9d, #c44dff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
  }
  .countdown .label {
    font-size: 12px; color: rgba(255,255,255,0.65);
    margin-top: 6px; letter-spacing: 2px;
  }

  /* 鈹€鈹€ 涓绘爣棰?鈹€鈹€ */
  .main-title {
    font-size: clamp(32px, 6vw, 60px);
    font-weight: 700;
    background: linear-gradient(135deg, #ff6b9d 0%, #c44dff 40%, #6bc5ff 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 30px rgba(196, 77, 255, 0.4));
    animation: titleGlow 3s ease-in-out infinite;
    margin-bottom: 8px;
    text-align: center;
    letter-spacing: 4px;
  }
  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(196,77,255,0.4)); }
    50% { filter: drop-shadow(0 0 40px rgba(255,107,157,0.6)); }
  }

  /* 鈹€鈹€ 鎯呰瘽灞曠ず鍖?鈹€鈹€ */
  .message-box {
    position: relative;
    max-width: 620px; width: 85vw;
    text-align: center;
    padding: 40px 36px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    margin: 16px 0;
  }
  .message-box .quotes {
    font-size: 20px; color: #fff;
    line-height: 1.8; letter-spacing: 1px;
    min-height: 60px;
    transition: opacity 0.5s, transform 0.5s;
  }
  .message-box .quotes.fade {
    opacity: 0; transform: translateY(10px);
  }

  /* 鈹€鈹€ 鎵撳瓧鍏夋爣 鈹€鈹€ */
  .cursor::after {
    content: '|';
    animation: blink 1s step-end infinite;
    color: #ff6b9d;
    font-weight: 300;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 鈹€鈹€ 鎸夐挳 鈹€鈹€ */
  .btn-row {
    display: flex; gap: 16px; margin-top: 10px;
    flex-wrap: wrap; justify-content: center;
  }
  .btn {
    padding: 10px 28px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
    font-family: inherit;
  }
  .btn:hover {
    background: rgba(255,107,157,0.2);
    border-color: #ff6b9d;
    box-shadow: 0 0 24px rgba(255,107,157,0.3);
    transform: translateY(-2px);
  }
  .btn.music-btn {
    position: fixed; top: 30px; right: 30px;
    padding: 8px 16px; z-index: 30;
  }

  /* 鈹€鈹€ 鍝嶅簲寮?鈹€鈹€ */
  @media (max-width: 480px) {
    .countdown { gap: 10px; top: 16px; }
    .countdown .unit { padding: 10px 14px; min-width: 60px; }
    .countdown .num { font-size: 24px; }
    .message-box { padding: 28px 24px; }
    .message-box .quotes { font-size: 16px; }
    .btn { padding: 8px 20px; font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<button class="btn music-btn" id="musicBtn" onclick="toggleMusic()">馃幍 闊充箰</button>

<div class="container">
  <div class="countdown" id="countdown">
    <div class="unit"><div class="num" id="days">0</div><div class="label">澶?/div></div>
    <div class="unit"><div class="num" id="hours">0</div><div class="label">鏃?/div></div>
    <div class="unit"><div class="num" id="mins">0</div><div class="label">鍒?/div></div>
    <div class="unit"><div class="num" id="secs">0</div><div class="label">绉?/div></div>
  </div>

  <h1 class="main-title" id="mainTitle">鍚磋€佸笀锛屽仛鎴戣€佸﹩涔嬪悗鍐嶆敼绉板懠鍝堛€?/h1>

  <div class="message-box">
    <div class="quotes cursor" id="quoteText"></div>
  </div>

  <div class="btn-row">
    <button class="btn" onclick="nextQuote()">鉁?鎹竴鍙?/button>
    <button class="btn" onclick="burstHearts()">馃挄 鐐规垜</button>
  </div>
</div>

<script>
// ==================== 鏁版嵁閰嶇疆 ====================
const LOVE_QUOTES = [
  "鎯宠涓€鐩村湪涓€璧凤紝涓嶆槸鑷锛岃繖涔熸槸鎴戠殑蹇冩効銆?,
  "涓嶈鎬€鐤戯紝涓嶈绾犵粨锛屾垜蹇冮噷瀵逛綘鏈夌潃鏃犻檺鐨勭儹鎯呫€?,
  "璇存槑浣犳槸寰堣鐪熺殑锛屾槸鐨勶紝涓嶇煡閬撲负浠€涔堝浣犳垜涓€鐩撮兘寰堣鐪熴€?,
  "浣犵殑鎬ф牸榄呭姏闈炲父鍚稿紩鎴戙€?,
  "杩欎竴浜╀笁鍒嗗湴鍙兘鏄垜鐨勩€?,
  "绛夌ǔ瀹氾紝浣犲氨鐭ラ亾浜嗭紝鎴戜篃涓嶆槸鍏虫敞浜嬫儏鐨勶紝鎴戞槸鍏虫敞鎯呯华鐨勩€?,
  "澶╁ぉ鍋ヨ韩鍋ヨ韩鍋ヨ韩锛屽仴韬瘮鎴戦噸瑕佸悧锛熷綋鐒朵笉鏄暒锛屼綘涔熷緢閲嶈鐨勩€?,
  "浣犳湁鏃堕棿绠″埆浜洪偅闂蹭簨锛屼笉濡傛潵绠＄鎴戯紝鎴戝氨杩欎箞涓嶅€煎緱浣犺姳蹇冩€濆悧锛?,
  "鎬庝箞浼氬憿锛屾垜鑲畾浼氫负浣犺姳蹇冩€濈殑鍛€锛?,
  "鎴戞湁鎯呯华鐨勶紝浣犱竴鐐归兘鎰熺煡涓嶅埌鍚楋紵鎴戣兘鎰熺煡鍒板晩",
  "绗竴锛屼綘鐨勬劅鐭ュ姏寰堝樊锛岀浜岋紝鍗充究浣犳劅鐭ュ埌浜嗭紝浣犱篃缁欏睆钄戒簡銆備互鍚庝笉浼氬暒",
  "铏界劧浣犳湁鏃跺€欏嚩宸村反鐨勭敓姘旓紝浣嗘槸鎴戣繕鏄効鎰忓惉浣犵户缁嚩宸村反銆傛垜璋㈣阿浣犲晩",
  "浣犺鎴戠殑鎬ф牸搴曡壊鏄緢涓嶉敊鐨勶紝甯屾湜涓嶄細璁╀綘澶辨湜銆?,
  "浣犺繖涓洖閬跨殑姣涚梾鑳戒笉鑳芥敼涓€鏀瑰晩锛屼笉瑕佽繖涔堝埆鎵暒銆傚綋鐒跺暒锛岃窡浣犲湪涓€璧锋椂闂翠箙浜嗭紝浠€涔堥兘鑳芥敼鎺夈€?,
  "閮戒細瓒婃潵瓒婂ソ鐨勶紝鏈熷緟鏈変綘鐨勬湭鏉ャ€?,
];

// 璁剧疆浣犱滑鍦ㄤ竴璧风殑鏃ユ湡 (淇敼杩欓噷!)
const TOGETHER_DATE = new Date('2026-08-08'); // <-- 鏀规垚浣犱滑鐨勭邯蹇垫棩

// ==================== Canvas 鏄熺┖鑳屾櫙 ====================
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H;

let stars = [];
let hearts = [];
let shootingStars = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initStars();
  initShootingStars();
}
window.addEventListener('resize', resize);

// 鏄熸槦
function initStars() {
  stars = [];
  const count = Math.floor(W * H / 1200);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.8 + 0.3,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005,
      opacity: Math.random(),
    });
  }
}

// 鐖卞績绮掑瓙
function Heart(x, y) {
  this.x = x; this.y = y;
  this.vx = (Math.random() - 0.5) * 1.5;
  this.vy = -(Math.random() * 2 + 2);
  this.size = Math.random() * 10 + 6;
  this.opacity = 1;
  this.fade = Math.random() * 0.015 + 0.008;
  this.angle = Math.random() * Math.PI * 2;
  this.spin = (Math.random() - 0.5) * 0.05;
  this.color = ['#ff6b9d','#c44dff','#ff9a9e','#6bc5ff','#ff6b6b'][Math.floor(Math.random()*5)];
}
Heart.prototype.update = function() {
  this.x += this.vx; this.y += this.vy;
  this.vy -= 0.02; // float up
  this.opacity -= this.fade;
  this.angle += this.spin;
};
Heart.prototype.draw = function(ctx) {
  ctx.save();
  ctx.globalAlpha = this.opacity;
  ctx.translate(this.x, this.y);
  ctx.rotate(this.angle);
  ctx.fillStyle = this.color;
  ctx.shadowBlur = 10;
  ctx.shadowColor = this.color;
  const s = this.size;
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.4);
  ctx.bezierCurveTo(-s*0.5, -s*0.9, -s, -s*0.2, 0, s*0.35);
  ctx.bezierCurveTo(s, -s*0.2, s*0.5, -s*0.9, 0, -s*0.4);
  ctx.fill();
  ctx.restore();
};

// 娴佹槦
function ShootingStar() {
  this.reset();
}
ShootingStar.prototype.reset = function() {
  this.x = Math.random() * W * 0.6;
  this.y = Math.random() * H * 0.3;
  this.len = Math.random() * 100 + 60;
  this.speed = Math.random() * 8 + 6;
  this.opacity = 1;
  this.fade = Math.random() * 0.015 + 0.01;
};
ShootingStar.prototype.update = function() {
  this.x += this.speed;
  this.y += this.speed * 0.5;
  this.opacity -= this.fade;
  if (this.opacity <= 0) this.reset();
};
ShootingStar.prototype.draw = function(ctx) {
  ctx.save();
  const grad = ctx.createLinearGradient(this.x, this.y, this.x - this.len, this.y - this.len * 0.5);
  grad.addColorStop(0, `rgba(255,255,255,${this.opacity})`);
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(this.x, this.y);
  ctx.lineTo(this.x - this.len, this.y - this.len * 0.5);
  ctx.stroke();
  ctx.restore();
};

function initShootingStars() {
  shootingStars = [];
  for (let i = 0; i < 3; i++) {
    const ss = new ShootingStar();
    ss.x = Math.random() * W;
    ss.y = Math.random() * H * 0.4;
    ss.opacity = Math.random() * 0.5;
    shootingStars.push(ss);
  }
}

// 鑳屾櫙娓愬彉鑹?const bgColors = [
  [10, 6, 30],  // 娣辩传榛?  [5, 3, 20],   // 鏇存殫
];

// ==================== 缁樺埗寰幆 ====================
let bgT = 0;
function drawBg(t) {
  bgT += 0.003;
  const c1 = [10 + Math.sin(t*0.3)*3, 6 + Math.sin(t*0.5)*2, 30 + Math.sin(t*0.4)*5];
  const c2 = [5 + Math.cos(t*0.4)*3, 3 + Math.cos(t*0.6)*2, 20 + Math.cos(t*0.5)*5];
  const grad = ctx.createRadialGradient(W*0.3, H*0.3, 0, W*0.5, H*0.5, Math.max(W,H)*0.7);
  grad.addColorStop(0, `rgb(${c1[0]|0},${c1[1]|0},${c1[2]|0})`);
  grad.addColorStop(0.5, `rgb(${c2[0]|0},${c2[1]|0},${c2[2]|0})`);
  grad.addColorStop(1, '#020010');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function render(timestamp) {
  ctx.clearRect(0, 0, W, H);
  drawBg(timestamp / 1000);

  // 鏄熸槦
  for (const s of stars) {
    s.twinkle += s.speed;
    s.opacity += (Math.sin(s.twinkle) * 0.01);
    s.opacity = Math.max(0.2, Math.min(1, s.opacity));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
    ctx.fill();
    // 浜槦鍔犲厜鏅?    if (s.r > 1.3 && s.opacity > 0.7) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,180,255,${s.opacity * 0.15})`;
      ctx.fill();
    }
  }

  // 娴佹槦
  for (const ss of shootingStars) {
    ss.update(); ss.draw(ctx);
  }

  // 鐖卞績绮掑瓙
  hearts = hearts.filter(h => h.opacity > 0);
  for (const h of hearts) {
    h.update(); h.draw(ctx);
  }

  requestAnimationFrame(render);
}

// ==================== 鐖卞績鐖嗙偢 ====================
function burstHearts(e) {
  let cx = W / 2, cy = H / 2;
  if (e && e.clientX) { cx = e.clientX; cy = e.clientY; }
  for (let i = 0; i < 40; i++) {
    const h = new Heart(cx, cy);
    h.vx = (Math.random() - 0.5) * 10;
    h.vy = -(Math.random() * 8 + 4);
    h.size = Math.random() * 20 + 10;
    h.fade = Math.random() * 0.008 + 0.004;
    hearts.push(h);
  }
}

// 鍗曞嚮绌虹櫧澶勪篃鐖嗙埍蹇?document.addEventListener('click', function(e) {
  if (e.target.tagName === 'BUTTON') return;
  burstHearts(e);
});

// ==================== 鎯呰瘽鎵撳瓧鏈?====================
let quoteIdx = 0;
let typeTimer = null;
const quoteEl = document.getElementById('quoteText');

function typeQuote(text) {
  quoteEl.classList.remove('cursor');
  quoteEl.classList.add('fade');
  clearTimeout(typeTimer);

  setTimeout(() => {
    quoteEl.textContent = '';
    quoteEl.classList.remove('fade');
    quoteEl.classList.add('cursor');

    let i = 0;
    function typeChar() {
      if (i < text.length) {
        quoteEl.textContent += text[i];
        i++;
        typeTimer = setTimeout(typeChar, 80 + Math.random() * 60);
      } else {
        quoteEl.classList.remove('cursor');
      }
    }
    typeChar();
  }, 400);
}

function nextQuote() {
  quoteIdx = (quoteIdx + 1) % LOVE_QUOTES.length;
  typeQuote(LOVE_QUOTES[quoteIdx]);
}

// 闅忔満璧峰
function initQuote() {
  quoteIdx = Math.floor(Math.random() * LOVE_QUOTES.length);
  typeQuote(LOVE_QUOTES[quoteIdx]);
}

// ==================== 鍊掕鏃?====================
function updateCountdown() {
  const now = new Date();
  const diff = now - TOGETHER_DATE;
  const totalSeconds = Math.max(0, Math.floor(diff / 1000));

  const d = Math.floor(totalSeconds / 86400);
  const h = Math.floor((totalSeconds % 86400) / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;

  document.getElementById('days').textContent = d;
  document.getElementById('hours').textContent = String(h).padStart(2, '0');
  document.getElementById('mins').textContent = String(m).padStart(2, '0');
  document.getElementById('secs').textContent = String(s).padStart(2, '0');
}

// ==================== 鑳屾櫙闊充箰 ====================
let musicOn = false;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function createMusic() {
  // 绠€鍗曠殑闊充箰鍜屽０鐢熸垚
  const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25]; // C major
  const chords = [
    [261.63, 329.63, 392.00], // C
    [293.66, 349.23, 440.00], // Dm
    [329.63, 392.00, 493.88], // Em
    [349.23, 440.00, 523.25], // F
    [392.00, 493.88, 587.33], // G
    [440.00, 523.25, 659.25], // Am
  ];

  const gainNode = audioCtx.createGain();
  gainNode.gain.value = 0.06;
  gainNode.connect(audioCtx.destination);

  let chordIdx = 0;
  let noteIdx = 0;

  const melody = [0, 2, 4, 2, 0, 1, 3, 5, 4, 2, 0, 1, 3, 4, 5, 7, 5, 4, 2, 0];

  // 鍜屽鸡閾哄簳
  function playChord() {
    const chord = chords[chordIdx % chords.length];
    chord.forEach(freq => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      g.gain.value = 0.025;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
      osc.connect(g);
      g.connect(gainNode);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 2.5);
    });
    chordIdx++;
  }

  // 鏃嬪緥
  function playMelody() {
    if (!musicOn) return;
    const freq = notes[melody[noteIdx % melody.length]];
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    g.gain.value = 0.04;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(g);
    g.connect(gainNode);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.5);
    noteIdx++;
    if (noteIdx % melody.length === 0) playChord();
  }

  setInterval(() => { if (musicOn) playMelody(); }, 600);
  setInterval(() => { if (musicOn) playChord(); }, 2500);
}

function toggleMusic() {
  if (!musicOn) {
    musicOn = true;
    document.getElementById('musicBtn').textContent = '馃攪 闈欓煶';
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } else {
    musicOn = false;
    document.getElementById('musicBtn').textContent = '馃幍 闊充箰';
  }
}

// ==================== 鍚姩 ====================
window.addEventListener('load', () => {
  resize();
  initQuote();
  updateCountdown();
  setInterval(updateCountdown, 1000);
  createMusic();
  requestAnimationFrame(render);

  // 鑷姩鎾斁闊充箰 (闇€瑕佷竴娆＄敤鎴蜂氦浜掑悗)
  document.addEventListener('click', function resumeAudio() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: false });
});

// 绐楀彛澶у皬鍙樺寲鏃朵繚鎸佸疄鏃舵覆鏌?window.addEventListener('resize', resize);
</script>
</body>
</html>
